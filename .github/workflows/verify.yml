name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs of the same workflow for the same ref when a new
# commit lands, saving CI minutes on stacked pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails since cmdline-tools 16:
          # the legacy `tools` package no longer exists.
          packages: platform-tools

      - name: Install required SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # lintDebug + lintAnalyzeDebug: run lint and check for fatal issues.
      # The analyze tasks fail the build if any lint error severity is found.
      - name: Run Android Lint
        run: ./gradlew lintDebug lintAnalyzeDebug --stacktrace

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-report
          path: app/build/reports/
          if-no-files-found: warn

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails since cmdline-tools 16:
          # the legacy `tools` package no longer exists.
          packages: platform-tools

      - name: Install required SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # The Secrets Gradle Plugin falls back to .env.example when .env is
      # absent, so tests compile without a real Gemini key.
      - name: Write .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          fi

      # testDebugUnitTest covers:
      #   - JVM/Robolectric tests under app/src/test
      #   - Room schema/migration tests that ship under app/schemas
      #   - Roborazzi screenshot verification (record mode is a separate task)
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # KSP exports the schema of the current Room `version` to app/schemas
      # during compilation, and only rewrites it when the schema changed.
      # Any diff here means a version bump whose <version>.json was not
      # committed, or an entity change that edited an existing schema in
      # place instead of bumping the version. MigrationTest covers the
      # matching MIGRATION_x_y (#147).
      - name: Check Room schemas are committed
        run: |
          changes=$(git status --porcelain -- app/schemas)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff --stat -- app/schemas
            echo "::error title=Room schema::Commit the generated schema as a NEW app/schemas/.../<version>.json (bump AppDatabase.version and add its migration) instead of changing an existing one."
            exit 1
          fi

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
